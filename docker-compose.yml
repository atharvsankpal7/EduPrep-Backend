version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: eduprep_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-eduprep}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-eduprep_secret}
      POSTGRES_DB: ${POSTGRES_DB:-eduprep_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-eduprep} -d ${POSTGRES_DB:-eduprep_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
